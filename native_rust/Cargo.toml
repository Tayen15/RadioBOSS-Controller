[package]
name = "rcb_studio"
version = "0.9.4"
edition = "2021"
authors = ["Firtiansyah Okta <tiantiantitik@gmail.com>"]
description = "Radio Caster Bridge Studio (RCB Studio) - Broadcast Audio Bridge & Controller"
build = "build.rs"

[[bin]]
name = "RCBStudio"
path = "src/main.rs"

[dependencies]
# Pure Native GPU GUI (Zero-WebView)
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.37.0", features = ["image", "http", "webp"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "ico"] }

# Native OS Dialogs & Shell
rfd = "0.18.0"
open = "5.4.5"

# Native Headphone Audio Preview
rodio = { version = "0.23.0", default-features = false, features = [
    "playback",
    "mp3",
    "mp4",
    "symphonia-aac",
    "vorbis",
    "wav",
] }

# Async Runtime, HTTP Client & Axum Stream Relay
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream", "charset", "http2", "gzip", "system-proxy"] }
futures-util = "0.3"
urlencoding = "2.1.3"

# Serialization & XML Parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.42.0"

# Embedded SQLite Storage
rusqlite = { version = "0.43.0", features = ["bundled"] }

# ID3v2 Tags & Cover Art
id3 = "1.17.4"

# System Specs, Hashing, Regex & Time
sysinfo = "0.40.4"
sha2 = "0.11.1"
uuid = { version = "1.29.3", features = ["v4"] }
regex = "1.13.2"
chrono = { version = "0.4.45", features = ["serde"] }
once_cell = "1.20"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
