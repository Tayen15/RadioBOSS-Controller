name: Build & Release Studio Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v0.9.4)"
        required: false
        default: "v0.9.4"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows-x64

          - os: ubuntu-latest
            target: Linux-x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_rust

      # --- Windows x64 Setup ---
      - name: Setup FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Setup Inno Setup Compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress

      - name: Build & Package Windows Setup (RCBStudio-Setup-x64.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --manifest-path native_rust/Cargo.toml
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "native_rust/target/release/RCBStudio.exe" "dist/RCBStudio.exe" -Force
          $ffmpegCmd = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if ($ffmpegCmd) {
            Copy-Item $ffmpegCmd.Source "dist/ffmpeg.exe" -Force
          }
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "dist/yt-dlp.exe" -UseBasicParsing
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppArch=x64 installer/setup.iss

      # --- Linux x64 Package ---
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Build & Package Linux (.deb & .tar.gz)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --manifest-path native_rust/Cargo.toml
          mkdir -p dist

          # Download standalone yt-dlp for Linux
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o dist/yt-dlp
          chmod +x dist/yt-dlp

          # 1. Universal .tar.gz archive
          mkdir -p dist/rcb-tar
          cp native_rust/target/release/RCBStudio dist/rcb-tar/RCBStudio
          cp dist/yt-dlp dist/rcb-tar/yt-dlp
          tar -czf dist/RCBStudio-Linux-x64.tar.gz -C dist/rcb-tar .

          # 2. Debian/Ubuntu .deb installer package
          PKG_DIR="dist/rcb-deb"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/opt/rcb-studio" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"
          cp native_rust/target/release/RCBStudio "$PKG_DIR/opt/rcb-studio/RCBStudio"
          cp dist/yt-dlp "$PKG_DIR/opt/rcb-studio/yt-dlp"
          chmod 755 "$PKG_DIR/opt/rcb-studio/RCBStudio" "$PKG_DIR/opt/rcb-studio/yt-dlp"
          ln -s /opt/rcb-studio/RCBStudio "$PKG_DIR/usr/bin/rcb-studio"
          cp native_rust/assets/logo.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/rcb-studio.png"

          VERSION=$(grep '^version =' native_rust/Cargo.toml | head -1 | cut -d '"' -f2)
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: rcb-studio
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg, libasound2t64 | libasound2, libgtk-3-0t64 | libgtk-3-0, libssl3
          Maintainer: Tayen <tiantiantitik@gmail.com>
          Description: Radio Caster Bridge Studio (RCB Studio) - Broadcast Audio Bridge & RadioBOSS Controller
          EOF

          cat > "$PKG_DIR/usr/share/applications/rcb-studio.desktop" <<EOF
          [Desktop Entry]
          Name=RCB Studio
          Comment=Radio Caster Bridge Studio
          Exec=/opt/rcb-studio/RCBStudio
          Icon=rcb-studio
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF

          dpkg-deb --build "$PKG_DIR" dist/RCBStudio-Linux-x64.deb

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/RCBStudio-Setup-x64.exe
            dist/RCBStudio-Linux-x64.deb
            dist/RCBStudio-Linux-x64.tar.gz
          if-no-files-found: warn
          retention-days: 2

  publish-release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: List Release Files
        run: |
          ls -la release-assets

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "RCB Studio ${{ github.ref_name || inputs.tag_name }}"
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
