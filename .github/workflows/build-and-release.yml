name: Build & Release Standalone Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v0.3.0)"
        required: false
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies & Build Static Export
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Verify Frontend Static Output
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "frontend/out/index.html")) {
            Write-Error "Frontend static build failed: frontend/out/index.html not found!"
            exit 1
          }
          Write-Host "Frontend static build verified successfully."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
        id: setup-ffmpeg

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Package Standalone Windows .exe
        shell: pwsh
        run: |
          python desktop/build_exe.py

      - name: Verify Executable Output
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "dist/RadioBOSSCaster.exe")) {
            Write-Error "PyInstaller build failed: dist/RadioBOSSCaster.exe not found!"
            exit 1
          }
          $item = Get-Item "dist/RadioBOSSCaster.exe"
          $sizeMb = [math]::Round($item.Length / 1MB, 2)
          Write-Host "Executable generated: dist/RadioBOSSCaster.exe ($sizeMb MB)"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "Radio Caster Bridge ${{ github.ref_name || inputs.tag_name }}"
          files: dist/RadioBOSSCaster.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
