name: Build & Release CastDeck Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows-x64

          - os: ubuntu-latest
            target: Linux-x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_rust

      # --- Windows x64 Setup ---
      - name: Setup FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Setup Inno Setup Compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress

      - name: Build & Package Windows Setup (CastDeck-Setup-x64.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --manifest-path native_rust/Cargo.toml
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "native_rust/target/release/CastDeck.exe" "dist/CastDeck.exe" -Force
          $ffmpegCmd = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if ($ffmpegCmd) {
            Copy-Item $ffmpegCmd.Source "dist/ffmpeg.exe" -Force
          }
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "dist/yt-dlp.exe" -UseBasicParsing
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppArch=x64 installer/setup.iss

      # --- Linux x64 Package ---
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Build & Package Linux (.deb & .tar.gz)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --manifest-path native_rust/Cargo.toml
          mkdir -p dist

          # Download standalone yt-dlp for Linux
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o dist/yt-dlp
          chmod +x dist/yt-dlp

          # 1. Universal .tar.gz archive
          mkdir -p dist/castdeck-tar
          cp native_rust/target/release/CastDeck dist/castdeck-tar/CastDeck
          cp dist/yt-dlp dist/castdeck-tar/yt-dlp
          tar -czf dist/CastDeck-Linux-x64.tar.gz -C dist/castdeck-tar .

          # 2. Debian/Ubuntu .deb installer package
          PKG_DIR="dist/castdeck-deb"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/opt/castdeck" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"
          cp native_rust/target/release/CastDeck "$PKG_DIR/opt/castdeck/CastDeck"
          cp dist/yt-dlp "$PKG_DIR/opt/castdeck/yt-dlp"
          chmod 755 "$PKG_DIR/opt/castdeck/CastDeck" "$PKG_DIR/opt/castdeck/yt-dlp"
          ln -s /opt/castdeck/CastDeck "$PKG_DIR/usr/bin/castdeck"
          cp native_rust/assets/logo.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/castdeck.png"

          VERSION=$(grep '^version =' native_rust/Cargo.toml | head -1 | cut -d '"' -f2)
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: castdeck
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg, libasound2t64 | libasound2, libgtk-3-0t64 | libgtk-3-0, libssl3
          Maintainer: Tayen <tiantiantitik@gmail.com>
          Description: CastDeck - Broadcast Audio Bridge & RadioBOSS Controller
          EOF

          cat > "$PKG_DIR/usr/share/applications/castdeck.desktop" <<EOF
          [Desktop Entry]
          Name=CastDeck
          Comment=Broadcast Audio Bridge & RadioBOSS Controller
          Exec=/opt/castdeck/CastDeck
          Icon=castdeck
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF

          dpkg-deb --build "$PKG_DIR" dist/CastDeck-Linux-x64.deb

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/CastDeck-Setup-x64.exe
            dist/CastDeck-Linux-x64.deb
            dist/CastDeck-Linux-x64.tar.gz
          if-no-files-found: warn
          retention-days: 2

  publish-release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate Categorized Release Notes
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          tag = "${{ github.ref_name || inputs.tag_name }}"
          repo = "${{ github.repository }}"
          curated = f"docs/releases/{tag}.md"

          tags_raw = subprocess.check_output(["git", "tag", "--sort=-v:refname"], text=True).splitlines()
          prev_tag = next((t for t in tags_raw if t != tag), "")

          if os.path.isfile(curated):
              with open(curated, "r", encoding="utf-8") as f:
                  body = f.read().strip()
          else:
              rng = f"{prev_tag}..HEAD" if prev_tag else "HEAD"
              lines = subprocess.check_output(
                  ["git", "log", rng, "--no-merges", "--pretty=format:%s"], text=True
              ).splitlines()

              noise = re.compile(r"(bump version|clippy|changelog|merge |wip)", re.I)
              feats, fixes, imps = [], [], []
              for raw in lines:
                  if noise.search(raw):
                      continue
                  m = re.match(r"^(feat|fix|refactor|perf|style)(?:\([^)]+\))?:\s*(.+)$", raw, re.I)
                  if not m:
                      continue
                  kind, msg = m.group(1).lower(), m.group(2).strip()
                  msg = msg[0].upper() + msg[1:] if msg else msg
                  if kind == "feat":
                      feats.append(f"- {msg}")
                  elif kind == "fix":
                      fixes.append(f"- {msg}")
                  else:
                      imps.append(f"- {msg}")

              parts = [f"## CastDeck {tag}\n"]
              for title, items in [("What's New", feats), ("Bug Fixes", fixes), ("Improvements", imps)]:
                  if items:
                      parts.append(f"### {title}")
                      parts.extend(items[:10])
                      if len(items) > 10:
                          parts.append(f"- *...and {len(items) - 10} more updates*")
                      parts.append("")
              body = "\n".join(parts).strip()

          if prev_tag:
              body += f"\n\n**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}"

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")
          print(body)
          PY

      - name: List Release Files
        run: |
          ls -la release-assets

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "CastDeck ${{ github.ref_name || inputs.tag_name }}"
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
